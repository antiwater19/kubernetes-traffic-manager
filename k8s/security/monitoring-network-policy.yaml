apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-metrics-scrape
  namespace: smart-traffic
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - test-web-app
          - traffic-analyzer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9000
