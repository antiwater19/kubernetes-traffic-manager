apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-traffic-demo-client
  namespace: smart-traffic
  labels:
    app: smart-traffic-demo-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-traffic-demo-client
  template:
    metadata:
      labels:
        app: smart-traffic-demo-client
    spec:
      containers:
        - name: client
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - while true; do wget -qO- http://test-web-app-service.smart-traffic.svc.cluster.local/api >/dev/null; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
