apiVersion: v1
kind: Namespace
metadata:
  name: hubble-validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-server
  namespace: hubble-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow-server
  template:
    metadata:
      labels:
        app: flow-server
    spec:
      containers:
        - name: http
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - mkdir -p /www && echo hubble-validation-ok > /www/index.html && httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flow-server
  namespace: hubble-validation
spec:
  selector:
    app: flow-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-client
  namespace: hubble-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow-client
  template:
    metadata:
      labels:
        app: flow-client
    spec:
      containers:
        - name: client
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - while true; do wget -qO- http://flow-server:8080/ >/dev/null; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
