apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-analyzer
  namespace: smart-traffic
  labels:
    app: traffic-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-analyzer
  template:
    metadata:
      labels:
        app: traffic-analyzer
    spec:
      serviceAccountName: traffic-analyzer-sa
      containers:
        - name: traffic-analyzer
          image: antiwater19/traffic-analyzer:v22
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: traffic-db-secret
                  key: DATABASE_URL
            - name: HUBBLE_RELAY_ADDRESS
              value: hubble-relay.kube-system.svc.cluster.local:80
            - name: AUTH_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: traffic-analyzer-auth
                  key: admin-username
            - name: AUTH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: traffic-analyzer-auth
                  key: admin-password
            - name: AUTH_VIEWER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: traffic-analyzer-auth
                  key: viewer-username
            - name: AUTH_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: traffic-analyzer-auth
                  key: viewer-password
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: traffic-analyzer-auth
                  key: session-secret
            - name: AUTH_INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: traffic-analyzer-auth
                  key: internal-api-token
            - name: AUTH_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: traffic-analyzer-auth
                  key: metrics-token
            - name: AUTH_COOKIE_SECURE
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
