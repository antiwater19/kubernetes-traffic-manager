apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-web-app-ingress
  namespace: smart-traffic
  labels:
    app: test-web-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-web-app-service
                port:
                  number: 80