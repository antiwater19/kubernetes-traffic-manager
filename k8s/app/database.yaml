apiVersion: v1
kind: Secret
metadata:
  name: traffic-db-secret
  namespace: smart-traffic
type: Opaque
stringData:
  POSTGRES_DB: traffic
  POSTGRES_USER: traffic
  POSTGRES_PASSWORD: traffic-dev-password
  DATABASE_URL: postgresql+psycopg://traffic:traffic-dev-password@traffic-db-service:5432/traffic
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traffic-db-data
  namespace: smart-traffic
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-db
  namespace: smart-traffic
  labels:
    app: traffic-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-db
  template:
    metadata:
      labels:
        app: traffic-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: traffic-db-secret
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: traffic-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-db-service
  namespace: smart-traffic
spec:
  type: ClusterIP
  selector:
    app: traffic-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
