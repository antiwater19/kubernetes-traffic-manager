apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: smart-traffic
data:
  test.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      vus: 5,
      duration: '30s',
    };

    const BASE_URL = __ENV.TARGET_URL ||
      'http://ingress-nginx-controller.ingress-nginx.svc.cluster.local';
    const PATHS = ['/api', '/api', '/api', '/slow', '/burst', '/error'];

    export default function () {
      const path = PATHS[Math.floor(Math.random() * PATHS.length)];
      http.get(`${BASE_URL}${path}`, {
        headers: { Host: 'test.local' },
        tags: { endpoint: path },
      });
      sleep(0.25);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-test
  namespace: smart-traffic
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-test
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["k6", "run", "/scripts/test.js"]
          env:
            - name: TARGET_URL
              value: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local
          volumeMounts:
            - name: k6-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: k6-script
          configMap:
            name: k6-script
      restartPolicy: Never
