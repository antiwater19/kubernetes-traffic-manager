apiVersion: batch/v1
kind: Job
metadata:
  name: k6-test
  namespace: smart-traffic
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-test
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["k6", "run", "/scripts/test.js"]
          env:
            - name: TARGET_URL
              value: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local
            - name: RUN_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: k6-run-profile
                  key: RUN_PROFILE
            - name: ANALYZE_AFTER_RUN
              value: "true"
            - name: ANALYZER_URL
              value: http://traffic-analyzer-service.smart-traffic.svc.cluster.local:9000/analyze?window_seconds=60
          volumeMounts:
            - name: k6-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: k6-script
          configMap:
            name: k6-script
      restartPolicy: Never
